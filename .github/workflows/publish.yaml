name: Publish to https://begoodev.fr

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a deployment halfway; queue the next one instead
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run deploy

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Same checks as the PR CI: nothing gets published if accessibility or SEO regress
      - name: Tests e2e (axe WCAG 2.2 AA, clavier, SEO)
        run: pnpm test:e2e

      - name: Deploy 🚀
        # Skipped when the workflow is replayed locally with nektos/act
        if: ${{ !env.ACT }}
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: out
          folder: dist/begoodev/browser
