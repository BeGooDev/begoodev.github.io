name: Publish to https://begoodev.fr

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never cancel a deployment halfway; queue the next one instead
concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build et tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run deploy

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      # Same checks as the PR CI: nothing gets published if accessibility or SEO regress
      - name: Tests e2e (axe WCAG 2.2 AA, clavier, SEO, composants)
        run: pnpm test:e2e

      - name: Upload site
        # Skipped when the workflow is replayed locally with nektos/act
        if: ${{ !env.ACT }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/begoodev/browser

  # Deployed with GitHub's official Pages actions (repo setting: Pages > Source > GitHub Actions),
  # instead of pushing to an `out` branch that triggered GitHub's own pages-build-deployment run
  deploy:
    name: publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy 🚀
        id: deployment
        uses: actions/deploy-pages@v5
